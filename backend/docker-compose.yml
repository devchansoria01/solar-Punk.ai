version: '3.8'

services:
  solarpunk-backend:
    build: .
    ports:
      - "7860:7860"
    env_file:
      - .env
    volumes:
      - .:/app  # Optional: syncs your code so you don't have to rebuild constantly
      - hf_cache:/root/.cache/huggingface
    
